<!DOCTYPE html>
<html lang="">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>
    <!-- MENU-->
     <!-- navbar - Barra de navegação do bootstrap
      navbar-expand-lg - Controla a responsividade. A partir de telas lg (large),
      o menu fica aberto/horizontal. Abaixo disso, pode ficar recolhido no botão sanduíche.
      bd-danger - Define a cord de fundo vermelho
      navbar-dark - Adapta os textos e ícones do navbar para serem utilizados sobre o fundo escuro.
      shadow - Adiciona uma sombra ao elemento.-->
    <nav class="navbar navbar-expand-lg bg-danger navbar-dark shadow">
        <div class="container">
            <!-- navbar-brand - Estiliza o elemtno como a marca/logo da navbar
             fw-bold - Deixa o texto em negrito (fw = font weith)
             fs - Define o tamanho da fonte (font size) vai até o 6-->
            <a class="navbar-brand fw-bold fs-4" href="#">
                Bella Pizza
            </a>
            <!-- navbar-toggler - Botão responsável por abrir e fechar o menu em telas maiores
             data-bs-toggle="collapse" - Informa que  o botão irá mostrar/esconder um elemento
             data-bs-target - Indica qual emento será aberto ou fechado. Nesse caso, procura o elemento que possui o id="menu"-->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#menu">
                <!-- navbar-toggler-icon - Exibe o botão sanduíche -->
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <!-- navbar-nav - Define a lista de navegação dentro do menu
                 ms-auto - Adiciona a margem automaticamente no lado inicial (start). Ou seja, empurra o item para a direita (ms - margin-start) -->
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#pizzas">
                            Pizzas
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#sobre">
                            Sobre
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#contato">
                            Contato
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</body>

</html>
